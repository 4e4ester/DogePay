<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes' blob: filesystem: about:; script-src * 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes' blob:; style-src * 'unsafe-inline' 'unsafe-hashes' blob:; img-src * blob: https:; font-src * https:; connect-src * https: wss:; frame-src * https:; child-src * https:; worker-src * blob:;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DogePay - Ads</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="logo-bounce">📢</div>
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container" id="main-content">
        
        <!-- HEADER -->
        <div class="header">
            <div class="logo-float">📢</div>
            <h1 class="gradient-title">Ads</h1>
            <p class="subtitle">Earn 🪙 by watching</p>
        </div>

        <!-- ADS CARD -->
        <div class="ads-card">
            <div class="reward-header">
                <span class="reward-icon">🎁</span>
                <h3>Get 5-10 🪙</h3>
            </div>
            <p class="reward-desc">Click the button, watch the offer and get your reward!</p>
            
            <!-- BUTTON -->
            <button id="claimAdBtn" class="btn btn-primary btn-large">
                <span class="btn-icon">🎬</span>
                <span class="btn-text">Watch for 5-10 🪙</span>
            </button>
            
            <!-- STATUS -->
            <p id="adStatus" class="ad-status status-ready">✅ Click to get reward!</p>
            
            <!-- TIMER -->
            <div id="cooldownTimer" class="cooldown-timer hidden">
                <span class="timer-icon">⏳</span>
                <span id="timerText">Next in: 00:00</span>
            </div>
        </div>

        <!-- INFO -->
        <div class="info-box">
            <p><strong>💰 Reward:</strong> 5-10 🪙 per click</p>
            <p><strong>⏰ Limit:</strong> once per 10 minutes</p>
            <p><strong>🔐 Safe:</strong> No personal data</p>
        </div>

        <!-- STATS -->
        <div class="stats-mini">
            <div class="stat-item">
                <span class="stat-value" id="adsWatched">0</span>
                <span class="stat-label">Watched</span>
            </div>
            <div class="stat-item">
                <span class="stat-value" id="adsEarned">0</span>
                <span class="stat-label">Earned 🪙</span>
            </div>
        </div>

        <!-- BACK BUTTON -->
        <a href="index.html" class="btn btn-secondary" onclick="playClick()">
            <span class="btn-icon">←</span><span>Home</span>
        </a>

        <!-- FOOTER -->
        <div class="footer"><p>🐕 DogePay • Ads</p></div>
    </div>

    <!-- SCRIPTS -->
    <script src="app.js"></script>
    
    <!-- ADSTERRA -->
    <script>
        function loadAdsterra() {
            const s = document.createElement('script');
            s.src = 'https://pl29015866.profitablecpmratenetwork.com/e7/8a/ff/e78aff0c9ab53cb2e8c1fcdefa074cea.js';
            s.async = true;
            s.onerror = () => console.warn('⚠️ Adsterra script failed');
            document.body.appendChild(s);
        }
        window.addEventListener('load', loadAdsterra);
    </script>
    
    <!-- LOGIC + FALLBACKS -->
    <script>
        // ===== ГЛОБАЛЬНЫЕ ЗАГЛУШКИ (на случай отсутствия в app.js) =====
        if (typeof window.playClick === 'undefined') {
            window.playClick = function() {
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
            };
        }
        if (typeof window.playClaim === 'undefined') {
            window.playClaim = function() {
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                }
            };
        }
        if (typeof window.playError === 'undefined') {
            window.playError = function() {
                if (window.Telegram?.WebApp?.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                }
            };
        }
        if (typeof window.updateBalance === 'undefined') {
            window.updateBalance = function() {
                console.log('updateBalance stub');
                return Promise.resolve();
            };
        }

        // ===== ОСНОВНАЯ ЛОГИКА =====
        const COOLDOWN_MS = 10 * 60 * 1000;
        const WATCH_MS = 12000;
        const REWARD_MIN = 5;
        const REWARD_MAX = 10;
        let isProcessing = false;
        let timerInterval = null;

        function getUserId() {
            const tg = window.Telegram?.WebApp;
            return tg?.initDataUnsafe?.user?.id || 123456;
        }

        function canClaim() {
            const last = parseInt(localStorage.getItem('lastAdReward') || '0');
            const now = Date.now();
            if (last === 0) return { ok: true, wait: 0 };
            const diff = now - last;
            if (diff >= COOLDOWN_MS) return { ok: true, wait: 0 };
            return { ok: false, wait: COOLDOWN_MS - diff };
        }

        function fmt(ms) {
            const s = Math.ceil(ms / 1000);
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
        }

        function updateUI() {
            const btn = document.getElementById('claimAdBtn');
            const status = document.getElementById('adStatus');
            const timerBox = document.getElementById('cooldownTimer');
            const timerText = document.getElementById('timerText');
            const check = canClaim();
            
            if (check.ok) {
                btn.disabled = false;
                const btnTextEl = btn.querySelector('.btn-text');
                if (btnTextEl) btnTextEl.textContent = 'Watch for 5-10 🪙';
                if (status) status.textContent = '✅ Click to get reward!';
                if (status) status.className = 'ad-status status-ready';
                if (timerBox) timerBox.classList.add('hidden');
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            } else {
                btn.disabled = true;
                if (status) status.textContent = '⏳ Wait before next reward';
                if (status) status.className = 'ad-status status-waiting';
                if (timerBox) timerBox.classList.remove('hidden');
                
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    const c = canClaim();
                    if (c.ok) { updateUI(); return; }
                    const waitMin = Math.ceil(c.wait / 60000);
                    if (timerText) timerText.textContent = `Next in: ${waitMin}m`;
                }, 1000);
                const waitMin = Math.ceil(check.wait / 60000);
                if (timerText) timerText.textContent = `Next in: ${waitMin}m`;
            }
        }

        async function handleAdReward() {
            if (isProcessing) return;
            const check = canClaim();
            if (!check.ok) {
                const waitMin = Math.ceil(check.wait / 60000);
                alert(`⏳ Wait ${waitMin} min`);
                return;
            }
            
            isProcessing = true;
            const btn = document.getElementById('claimAdBtn');
            const btnText = btn.querySelector('.btn-text');
            const status = document.getElementById('adStatus');
            
            btn.disabled = true;
            if (btnText) btnText.textContent = '⏳ Processing...';
            if (status) status.textContent = '🔄 Opening offer...';
            
            try {
                // Имитация просмотра (12 сек)
                await new Promise(res => setTimeout(res, WATCH_MS));
                
                const reward = Math.floor(Math.random() * (REWARD_MAX - REWARD_MIN + 1)) + REWARD_MIN;
                
                const res = await fetch('/api/ad-reward', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: getUserId(), reward: reward, type: 'popunder_click' })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    if (window.playClaim) window.playClaim();
                    if (window.Telegram?.WebApp?.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    }
                    
                    // Обновление отображения баланса (если элементы есть на странице)
                    const balanceEl = document.getElementById('balance');
                    if (balanceEl) {
                        const cur = parseInt(balanceEl.textContent.replace(/\s/g,'')) || 0;
                        balanceEl.textContent = (cur + reward).toLocaleString('en-US');
                        balanceEl.classList.add('pulse-once');
                        setTimeout(() => balanceEl.classList.remove('pulse-once'), 300);
                    }
                    
                    const dogeEl = document.getElementById('balance-doge');
                    if (dogeEl) {
                        const curDoge = parseFloat(dogeEl.textContent) || 0;
                        dogeEl.textContent = (curDoge + reward / 1000).toFixed(4);
                    }
                    
                    if (window.updateBalance) await window.updateBalance();
                    
                    localStorage.setItem('lastAdReward', Date.now().toString());
                    
                    let w = parseInt(localStorage.getItem('adsWatched')||'0');
                    let e = parseInt(localStorage.getItem('adsEarned')||'0');
                    w++; e += reward;
                    localStorage.setItem('adsWatched', w.toString());
                    localStorage.setItem('adsEarned', e.toString());
                    
                    const watchedEl = document.getElementById('adsWatched');
                    const earnedEl = document.getElementById('adsEarned');
                    if (watchedEl) watchedEl.textContent = w;
                    if (earnedEl) earnedEl.textContent = e.toLocaleString('en-US');
                    
                    if (status) {
                        status.textContent = `✅ Received ${reward} 🪙!`;
                        status.className = 'ad-status status-success';
                    }
                    
                    const popup = document.createElement('div');
                    popup.className = 'reward-toast';
                    popup.innerHTML = `<span>🎉 +${reward} 🪙</span>`;
                    document.body.appendChild(popup);
                    setTimeout(() => popup.remove(), 2500);
                    
                    setTimeout(updateUI, 2000);
                    
                } else {
                    throw new Error(data.error || 'Server error');
                }
                
            } catch (err) {
                console.error('❌ ERROR:', err);
                const status = document.getElementById('adStatus');
                if (status) {
                    status.textContent = '❌ Error';
                    status.className = 'ad-status status-error';
                }
                alert('🌐 Error: ' + (err.message || 'Try again'));
                if (window.playError) window.playError();
            } finally {
                isProcessing = false;
                btn.disabled = false;
                const btnTextEl = btn.querySelector('.btn-text');
                if (btnTextEl) btnTextEl.textContent = 'Watch for 5-10 🪙';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading-screen');
                const main = document.getElementById('main-content');
                if (loading) loading.classList.add('hidden');
                if (main) { main.style.display = 'block'; main.classList.add('fade-in'); }
                if (window.initApp) window.initApp();
                
                const watchedEl = document.getElementById('adsWatched');
                const earnedEl = document.getElementById('adsEarned');
                if (watchedEl) watchedEl.textContent = localStorage.getItem('adsWatched') || '0';
                if (earnedEl) earnedEl.textContent = (parseInt(localStorage.getItem('adsEarned')||'0')).toLocaleString('en-US');
                
                updateUI();
                
                const claimBtn = document.getElementById('claimAdBtn');
                if (claimBtn) {
                    claimBtn.addEventListener('click', () => {
                        if (window.playClick) window.playClick();
                        handleAdReward();
                    });
                }
            }, 1500);
        });
        
        window.addEventListener('beforeunload', () => {
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
    
    <style>
        .reward-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.reward-icon{font-size:32px;animation:bounce 2s ease-in-out infinite}.reward-header h3{margin:0;font-size:20px;color:var(--text-primary)}.reward-desc{font-size:14px;color:var(--text-secondary);margin:0 0 20px;line-height:1.4}.btn-large{padding:18px 24px;font-size:16px;margin-bottom:16px}.ad-status{font-size:14px;text-align:center;margin:8px 0;min-height:20px}.ad-status.status-ready{color:var(--text-success)}.ad-status.status-waiting{color:var(--text-secondary)}.ad-status.status-success{color:var(--gold);font-weight:600}.ad-status.status-error{color:var(--text-error)}.cooldown-timer{background:rgba(243,198,35,0.08);border:1px solid rgba(243,198,35,0.2);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text-secondary)}.timer-icon{font-size:16px}.reward-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));color:var(--bg-primary);padding:14px 28px;border-radius:50px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;z-index:10000;box-shadow:0 10px 40px rgba(243,198,35,0.5);opacity:0;transition:transform .3s ease,opacity .3s ease}.reward-toast.reward-show{transform:translateX(-50%) translateY(0);opacity:1}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
</body>
</html>
