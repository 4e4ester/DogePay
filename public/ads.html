<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- 🔥 CSP FIX FOR ADSTERRA - ПЕРВЫМ! 🔥 -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes' data: blob: filesystem: about:; script-src * 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes' data: blob:; style-src * 'unsafe-inline' 'unsafe-hashes' data: blob: https://fonts.googleapis.com; img-src * data: blob: https:; font-src * data: https://fonts.gstatic.com; connect-src * https: wss:; frame-src * https:; child-src * https:; worker-src * blob:; manifest-src *; form-action *; base-uri *;">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DogePay - Реклама</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="logo-bounce">📢</div>
            <div class="spinner"></div>
            <p class="loading-text">Загрузка...</p>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container" id="main-content">
        <!-- ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА -->
        <button id="langSwitch" class="lang-switch" onclick="toggleLanguage()">🇷🇺 🇬🇧</button>
        
        <!-- ШАПКА -->
        <div class="header">
            <div class="logo-float">📢</div>
            <h1 class="gradient-title">Реклама</h1>
            <p class="subtitle">Получай 🪙 за просмотр</p>
        </div>

        <!-- 🎁 КАРТОЧКА НАГРАДЫ -->
        <div class="ads-card">
            <div class="reward-header">
                <span class="reward-icon">🎁</span>
                <h3>Получи 5-10 🪙</h3>
            </div>
            <p class="reward-desc">Нажми кнопку, посмотри предложение и получи награду!</p>
            
            <!-- КНОПКА -->
            <button id="claimAdBtn" class="btn btn-primary btn-large" onclick="handleAdReward()">
                <span class="btn-icon">🎬</span>
                <span class="btn-text">Смотреть за 5-10 🪙</span>
                <span class="btn-loader hidden"></span>
            </button>
            
            <!-- СТАТУС -->
            <p id="adStatus" class="ad-status"></p>
            
            <!-- ТАЙМЕР -->
            <div id="cooldownTimer" class="cooldown-timer hidden">
                <span class="timer-icon">⏳</span>
                <span id="timerText">Следующая через: 00:00</span>
            </div>
        </div>

        <!-- ИНФО -->
        <div class="info-box">
            <p><strong>💰 Награда:</strong> 5-10 🪙 за клик</p>
            <p><strong>⏰ Лимит:</strong> 1 раз в 10 минут</p>
            <p><strong>🔐 Безопасно:</strong> Никаких личных данных</p>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats-mini">
            <div class="stat-item"><span class="stat-value" id="adsWatched">0</span><span class="stat-label">Просмотрено</span></div>
            <div class="stat-item"><span class="stat-value" id="adsEarned">0</span><span class="stat-label">Заработано 🪙</span></div>
        </div>

        <!-- НАЗАД -->
        <a href="index.html" class="btn btn-secondary" onclick="playClick()">
            <span class="btn-icon">←</span><span>На главную</span>
        </a>

        <!-- ФУТЕР -->
        <div class="footer"><p>🐕 DogePay • Реклама</p></div>
    </div>

    <!-- СКРИПТЫ -->
    <script src="translations.js"></script>
    <script src="app.js"></script>
    
    <!-- 🪟 ADSTERRA POPUNDER (ID: 28915367) - ДИНАМИЧЕСКАЯ ЗАГРУЗКА -->
    <script>
        function loadAdsterra() {
            const s = document.createElement('script');
            s.src = 'https://pl29015866.profitablecpmratenetwork.com/e7/8a/ff/e78aff0c9ab53cb2e8c1fcdefa074cea.js';
            s.async = true;
            s.onerror = () => console.warn('⚠️ Adsterra script failed');
            document.body.appendChild(s);
        }
        if (document.readyState === 'complete') loadAdsterra();
        else window.addEventListener('load', loadAdsterra);
    </script>
    
    <!-- ЛОГИКА НАГРАДЫ -->
    <script>
        const AD_REWARD_MIN = 5, AD_REWARD_MAX = 10, AD_COOLDOWN = 10 * 60 * 1000, AD_WATCH_TIME = 12000;
        let isProcessing = false, countdownInterval = null;
        
        function getUserId() { const tg = window.Telegram?.WebApp; return tg?.initDataUnsafe?.user?.id || 123456; }
        
        function canClaimAdReward() {
            const last = localStorage.getItem('lastAdReward');
            if (!last) return { can: true, remaining: 0 };
            const rem = AD_COOLDOWN - (Date.now() - parseInt(last));
            return { can: rem <= 0, remaining: Math.max(0, rem) };
        }
        
        function formatTime(ms) {
            const s = Math.ceil(ms/1000), m = Math.floor(s/60);
            return `${m.toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
        }
        
        function updateAdUI() {
            const btn = document.getElementById('claimAdBtn'), status = document.getElementById('adStatus'), 
                  cooldown = document.getElementById('cooldownTimer'), timerText = document.getElementById('timerText'),
                  check = canClaimAdReward();
            if (check.can) {
                btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Смотреть за 5-10 🪙';
                btn.querySelector('.btn-loader').classList.add('hidden');
                status.textContent = '✅ Нажми чтобы получить награду!'; status.className = 'ad-status status-ready';
                cooldown.classList.add('hidden');
            } else {
                btn.disabled = true; status.textContent = '⏳ Подожди перед следующей наградой';
                status.className = 'ad-status status-waiting'; cooldown.classList.remove('hidden');
                startCooldownTimer(check.remaining, timerText);
            }
        }
        
        function startCooldownTimer(rem, el) {
            if (countdownInterval) clearInterval(countdownInterval);
            const upd = () => { const c = canClaimAdReward(); if (c.can) { clearInterval(countdownInterval); updateAdUI(); return; } el.textContent = `Следующая через: ${formatTime(c.remaining)}`; };
            upd(); countdownInterval = setInterval(upd, 1000);
        }
        
        async function handleAdReward() {
            if (isProcessing) return; const check = canClaimAdReward();
            if (!check.can) { showToast(`⏳ Подожди ещё ${formatTime(check.remaining)}`, 'info'); return; }
            isProcessing = true; const btn = document.getElementById('claimAdBtn'), btnText = btn.querySelector('.btn-text'),
                  btnLoader = btn.querySelector('.btn-loader'), status = document.getElementById('adStatus');
            btn.disabled = true; btnText.textContent = 'Загрузка...'; btnLoader.classList.remove('hidden');
            status.textContent = '🔄 Открываем предложение...';
            try {
                await new Promise(r => setTimeout(r, AD_WATCH_TIME));
                const reward = Math.floor(Math.random() * (AD_REWARD_MAX - AD_REWARD_MIN + 1)) + AD_REWARD_MIN;
                const res = await fetch('/api/ad-reward', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: getUserId(), reward, type: 'popunder_click' }) });
                const data = await res.json();
                if (data.success) {
                    if (window.playClaim) playClaim();
                    if (window.Telegram?.WebApp?.HapticFeedback) window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    showRewardPopup(reward); await updateBalanceWithReward(reward);
                    localStorage.setItem('lastAdReward', Date.now().toString()); updateLocalStats(reward);
                    status.textContent = `✅ Получено ${reward} 🪙!`; status.className = 'ad-status status-success';
                    showToast(`🎉 +${reward} 🪙 зачислено!`, 'success'); setTimeout(updateAdUI, 2000);
                } else throw new Error(data.error || 'Сервер не подтвердил');
            } catch (e) { console.error('❌ Ad reward error:', e); status.textContent = '❌ Ошибка'; status.className = 'ad-status status-error'; showToast('🌐 Ошибка получения награды', 'error'); if (window.playError) playError(); }
            finally { isProcessing = false; btn.disabled = false; btnText.textContent = 'Смотреть за 5-10 🪙'; btnLoader.classList.add('hidden'); }
        }
        
        async function updateBalanceWithReward(reward) {
            const bal = document.getElementById('balance'), doge = document.getElementById('balance-doge');
            if (bal) { const c = parseInt(bal.textContent.replace(/\s/g,''))||0; bal.textContent = (c+reward).toLocaleString('ru-RU'); bal.classList.add('pulse-once'); setTimeout(()=>bal.classList.remove('pulse-once'),300); }
            if (doge) doge.textContent = ((parseFloat(doge.textContent)||0) + reward/1000).toFixed(4);
            if (window.updateBalance) await window.updateBalance();
        }
        
        function showRewardPopup(amount) {
            const p = document.createElement('div'); p.className = 'reward-toast reward-success';
            p.innerHTML = `<span class="reward-icon">🎉</span><span class="reward-text">+${amount} 🪙</span>`;
            document.body.appendChild(p); requestAnimationFrame(()=>p.classList.add('reward-show'));
            setTimeout(()=>{ p.classList.remove('reward-show'); setTimeout(()=>p.remove(),300); }, 2500);
        }
        
        function showToast(msg, type='info') {
            if (window.showToast) { window.showToast(msg,type); return; }
            const t = document.createElement('div'); t.className = `toast toast-${type}`; t.textContent = msg;
            document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('toast-show'));
            setTimeout(()=>{ t.classList.remove('toast-show'); setTimeout(()=>t.remove(),300); }, 3000);
        }
        
        function updateLocalStats(reward) {
            let w = parseInt(localStorage.getItem('adsWatched')||'0'), e = parseInt(localStorage.getItem('adsEarned')||'0');
            w++; e+=reward; localStorage.setItem('adsWatched',w.toString()); localStorage.setItem('adsEarned',e.toString());
            document.getElementById('adsWatched').textContent = w; document.getElementById('adsEarned').textContent = e.toLocaleString('ru-RU');
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading-screen'), main = document.getElementById('main-content');
                if (loading) loading.classList.add('hidden'); if (main) { main.style.display='block'; main.classList.add('fade-in'); }
                if (window.initApp) window.initApp();
                document.getElementById('adsWatched').textContent = localStorage.getItem('adsWatched')||'0';
                document.getElementById('adsEarned').textContent = (parseInt(localStorage.getItem('adsEarned')||'0')).toLocaleString('ru-RU');
                updateAdUI();
            }, 1500);
        });
        window.addEventListener('beforeunload', () => { if (countdownInterval) clearInterval(countdownInterval); });
    </script>
    
    <!-- СТИЛИ -->
    <style>
        .reward-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.reward-icon{font-size:32px;animation:bounce 2s ease-in-out infinite}.reward-header h3{margin:0;font-size:20px;color:var(--text-primary)}.reward-desc{font-size:14px;color:var(--text-secondary);margin:0 0 20px;line-height:1.4}.btn-large{padding:18px 24px;font-size:16px;margin-bottom:16px}.ad-status{font-size:14px;text-align:center;margin:8px 0;min-height:20px}.ad-status.status-ready{color:var(--text-success)}.ad-status.status-waiting{color:var(--text-secondary)}.ad-status.status-success{color:var(--gold);font-weight:600}.ad-status.status-error{color:var(--text-error)}.cooldown-timer{background:rgba(243,198,35,0.08);border:1px solid rgba(243,198,35,0.2);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text-secondary)}.timer-icon{font-size:16px}.reward-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));color:var(--bg-primary);padding:14px 28px;border-radius:50px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;z-index:10000;box-shadow:0 10px 40px rgba(243,198,35,0.5);opacity:0;transition:transform .3s ease,opacity .3s ease}.reward-toast.reward-show{transform:translateX(-50%) translateY(0);opacity:1}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
</body>
</html>
