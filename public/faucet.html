<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DogePay - Кран</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- ИСПРАВЛЕНО: синтаксис wght -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="logo-bounce">🚰</div>
            <div class="spinner"></div>
            <p class="loading-text">Загрузка...</p>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container" id="main-content">
        
        <!-- ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА -->
        <button id="langSwitch" class="lang-switch" onclick="toggleLanguage()">🇷🇺 🇬🇧</button>
        
        <!-- ШАПКА -->
        <div class="header">
            <div class="logo-float">🚰</div>
            <h1 class="gradient-title">Кран</h1>
            <p class="subtitle">Забери бесплатные монеты</p>
        </div>

        <!-- ТАЙМЕР -->
        <div class="timer-card">
            <p class="timer-label">До следующего сбора:</p>
            <div id="timer" class="timer-display">00:00</div>
            <div id="timer-status" class="timer-status status-ready">✅ Можно забирать!</div>
        </div>

        <!-- КНОПКА ЗАБРАТЬ -->
        <button id="claimBtn" class="btn btn-primary btn-large" onclick="playClick(); showCaptcha()">
            <span class="btn-icon">🎁</span>
            <span>ЗАБРАТЬ (10-30 🪙)</span>
        </button>

        <!-- CAPTCHA БЛОК -->
        <div id="captchaContainer" class="captcha-container hidden">
            <div class="captcha-card">
                <p class="captcha-title">🔐 Проверка</p>
                <p class="captcha-question" id="captchaQuestion">Сколько будет 5 + 3?</p>
                <input type="number" id="captchaInput" class="captcha-input" placeholder="?" inputmode="numeric">
                <button id="verifyCaptchaBtn" class="btn btn-primary" onclick="onVerifyCaptcha()">Проверить</button>
                <!-- ДОБАВЛЕНО: кнопка отмены капчи -->
                <button id="cancelCaptchaBtn" class="btn btn-secondary" onclick="hideCaptcha()" style="margin-top: 10px;">Отмена</button>
                <p id="captchaError" class="captcha-error hidden">❌ Неверно! Попробуй ещё раз.</p>
            </div>
        </div>

        <!-- ПОПАП НАГРАДЫ -->
        <div id="rewardPopup" class="reward-popup hidden">
            <div class="reward-content">
                <span class="reward-icon">🎉</span>
                <span class="reward-text">+<span id="rewardAmount">0</span> 🪙</span>
            </div>
        </div>

        <!-- ИНФО БЛОК -->
        <div class="info-box">
            <p>💎 Награда: <strong>10-30 🪙</strong></p>
            <p>⏰ Интервал: <strong>30 минут</strong></p>
            <p>🔐 CAPTCHA: защита от ботов</p>
        </div>

        <!-- КНОПКА НАЗАД -->
        <a href="index.html" class="btn btn-secondary" onclick="playClick()">
            <span class="btn-icon">←</span>
            <span>На главную</span>
        </a>

        <!-- ФУТЕР -->
        <div class="footer">
            <p>🐕 DogePay • Кран</p>
        </div>
    </div>

    <script>
        // ===== ЗАГЛУШКИ ДЛЯ ОТСУТСТВУЮЩИХ ФУНКЦИЙ =====
        window.playClick = window.playClick || function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        };
        window.playClaim = window.playClaim || function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
        };
        window.playError = window.playError || function() {
            if (window.Telegram?.WebApp?.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
            }
        };
        window.updateBalance = window.updateBalance || function() {
            console.log("updateBalance заглушка");
            return Promise.resolve();
        };
        window.addBalance = window.addBalance || function(amount) {
            console.log("addBalance заглушка, +", amount);
        };
        window.initApp = window.initApp || function() {
            console.log("initApp заглушка");
        };
        window.toggleLanguage = window.toggleLanguage || function() {
            console.log("toggleLanguage заглушка");
        };
        window.showToast = window.showToast || function(message, type) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span class="toast-text">${message}</span>`;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('toast-show'));
            setTimeout(() => {
                toast.classList.remove('toast-show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };
    </script>
    <script src="translations.js"></script>
    <script src="app.js"></script>
    <script>
        // ===== ЛОГИКА КРАНА =====
        // 🔥 КУЛДАУН: 30 минут = 1800 секунд = 1800000 мс 🔥
        const FAUCET_COOLDOWN_MS = 30 * 60 * 1000;
        
        let currentCaptcha = { answer: 0 };
        let claimLock = false;
        let timerInterval = null;

        // Получение user_id
        function getUserId() {
            const tg = window.Telegram?.WebApp;
            if (tg?.initDataUnsafe?.user?.id) {
                return tg.initDataUnsafe.user.id;
            }
            return 123456;
        }

        // 🔥 ФОРМАТИРОВАНИЕ ВРЕМЕНИ (поддержка часов) 🔥
        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            
            if (h > 0) {
                return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        // Запуск таймера
        function startTimer(endTimestamp) {
            const timerEl = document.getElementById('timer');
            const statusEl = document.getElementById('timer-status');
            const claimBtn = document.getElementById('claimBtn');
            
            if (timerInterval) clearInterval(timerInterval);
            
            function update() {
                const now = Date.now();
                const diff = endTimestamp - now;
                
                if (diff <= 0) {
                    timerEl.textContent = '00:00';
                    statusEl.textContent = '✅ Можно забирать!';
                    statusEl.className = 'timer-status status-ready';
                    claimBtn.disabled = false;
                    claimBtn.classList.remove('disabled');
                    if (timerInterval) clearInterval(timerInterval);
                } else {
                    const secondsLeft = Math.ceil(diff / 1000);
                    timerEl.textContent = formatTime(secondsLeft);
                    statusEl.textContent = '⏳ Жди...';
                    statusEl.className = 'timer-status status-waiting';
                    claimBtn.disabled = true;
                    claimBtn.classList.add('disabled');
                }
            }
            update();
            timerInterval = setInterval(update, 1000);
        }

        // Генерация CAPTCHA (без отрицательных ответов)
        function generateCaptcha() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            // ИСПРАВЛЕНО: вычитание только если a >= b, иначе сложение
            let op;
            let answer;
            if (a >= b) {
                op = Math.random() < 0.5 ? '+' : '-';
                answer = op === '+' ? a + b : a - b;
            } else {
                op = '+';
                answer = a + b;
            }
            
            currentCaptcha.answer = answer;
            currentCaptcha.question = `${a} ${op} ${b}`;
            
            document.getElementById('captchaQuestion').innerHTML = `Решите: <strong>${currentCaptcha.question} = ?</strong>`;
            document.getElementById('captchaInput').value = '';
            document.getElementById('captchaError').classList.add('hidden');
        }

        // Показать CAPTCHA
        function showCaptcha() {
            generateCaptcha();
            document.getElementById('captchaContainer').classList.remove('hidden');
            document.getElementById('claimBtn').classList.add('hidden');
            document.getElementById('captchaInput').focus();
        }

        // Скрыть CAPTCHA
        function hideCaptcha() {
            document.getElementById('captchaContainer').classList.add('hidden');
            document.getElementById('claimBtn').classList.remove('hidden');
        }

        // Показать награду
        function showReward(amount) {
            const popup = document.getElementById('rewardPopup');
            const amountEl = document.getElementById('rewardAmount');
            amountEl.textContent = amount;
            popup.classList.remove('hidden');
            
            popup.style.animation = 'none';
            popup.offsetHeight;
            popup.style.animation = 'rewardPop 0.5s ease forwards';
            
            setTimeout(() => {
                popup.classList.add('hidden');
            }, 2500);
        }

        // Запрос к API
        async function claimReward() {
            if (claimLock) return;
            claimLock = true;

            const userId = getUserId();
            console.log('🚰 Claim request - User ID:', userId);

            try {
                const res = await fetch('/api/claim', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userId,
                        username: window.Telegram?.WebApp?.initDataUnsafe?.user?.username || ''
                    })
                });

                console.log('📡 Response status:', res.status);
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }
                
                const data = await res.json();
                console.log('📦 Response data:', data);
                
                if (data.success) {
                    const reward = data.reward || data.amount;
                    console.log('✅ Reward:', reward);
                    
                    if (window.playClaim) window.playClaim();
                    if (window.Telegram?.WebApp?.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                    }
                    
                    showReward(reward);
                    if (window.updateBalance) await window.updateBalance();
                    if (window.addBalance) window.addBalance(reward);
                    
                    // 🔥 СОХРАНЯЕМ ВРЕМЯ СЛЕДУЮЩЕГО КРАНА (30 МИН) 🔥
                    const nextClaim = Date.now() + FAUCET_COOLDOWN_MS;
                    if (typeof localStorage !== 'undefined') {
                        localStorage.setItem('lastClaim', nextClaim.toString());
                    }
                    startTimer(nextClaim);
                    
                    window.showToast(`✅ +${reward} 🪙`, 'success');
                    
                } else if (data.error?.includes('Подождите') || data.waitTime) {
                    const waitTime = data.waitTime || FAUCET_COOLDOWN_MS;
                    const nextClaim = Date.now() + waitTime;
                    if (typeof localStorage !== 'undefined') {
                        localStorage.setItem('lastClaim', nextClaim.toString());
                    }
                    startTimer(nextClaim);
                    window.showToast('⏳ ' + (data.error || 'Подождите'), 'info');
                } else {
                    const errorMsg = data.error || 'Неизвестная ошибка';
                    console.error('❌ API error:', errorMsg);
                    window.showToast('❌ ' + errorMsg, 'error');
                    if (window.playError) window.playError();
                }
                
            } catch (err) {
                console.error('🌐 Network error:', err);
                let errorMsg = '🌐 Ошибка сети';
                if (err.message.includes('Failed to fetch')) {
                    errorMsg = '❌ Не удалось подключиться к серверу';
                } else if (err.message.includes('404')) {
                    errorMsg = '❌ API endpoint не найден';
                } else if (err.message.includes('500')) {
                    errorMsg = '❌ Ошибка сервера';
                }
                window.showToast(errorMsg, 'error');
                if (window.playError) window.playError();
            } finally {
                claimLock = false;
                hideCaptcha();
            }
        }

        // Проверка CAPTCHA
        function onVerifyCaptcha() {
            const inputEl = document.getElementById('captchaInput');
            if (!inputEl) return;
            const userAnswer = parseInt(inputEl.value, 10);
            
            if (isNaN(userAnswer)) {
                const errorEl = document.getElementById('captchaError');
                if (errorEl) {
                    errorEl.textContent = '❌ Введите число';
                    errorEl.classList.remove('hidden');
                }
                return;
            }
            
            if (userAnswer !== currentCaptcha.answer) {
                const errorEl = document.getElementById('captchaError');
                if (errorEl) {
                    errorEl.textContent = '❌ Неверно! Попробуй ещё раз.';
                    errorEl.classList.remove('hidden');
                    errorEl.style.animation = 'shake 0.3s ease';
                    setTimeout(() => errorEl.style.animation = '', 300);
                }
                generateCaptcha();
                return;
            }
            
            claimReward();
        }

        // Enter в поле CAPTCHA
        const captchaInput = document.getElementById('captchaInput');
        if (captchaInput) {
            captchaInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') onVerifyCaptcha();
            });
        }

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading-screen');
                const main = document.getElementById('main-content');
                
                if (loading) loading.classList.add('hidden');
                if (main) {
                    main.style.display = 'block';
                    main.classList.add('fade-in');
                }
                if (window.initApp) window.initApp();
                
                // Проверить таймер
                let lastClaim = null;
                if (typeof localStorage !== 'undefined') {
                    lastClaim = localStorage.getItem('lastClaim');
                }
                console.log('🕐 Last claim:', lastClaim);
                
                if (lastClaim && Date.now() < parseInt(lastClaim)) {
                    startTimer(parseInt(lastClaim));
                } else {
                    console.log('✅ Faucet ready!');
                }
            }, 1500);
        });

        // Очистка таймера
        window.addEventListener('beforeunload', () => {
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
</body>
</html>
