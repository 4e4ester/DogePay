<!DOCTYPE html> 
 <html lang="ru"> 
 <head> 
     <meta charset="UTF-8"> 
     <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
     <title>DogePay - Задания</title> 
     <link rel="stylesheet" href="style.css"> 
     <script src="https://telegram.org/js/telegram-web-app.js"></script> 
     <script src="https://adsgram.ai/adsgram.min.js"></script> 
 </head> 
 <body> 
     <div class="container"> 
         <div class="header"> 
             <h1>📋 Задания</h1> 
             <p>Выполняй задания и получай монеты</p> 
         </div> 
         
         <button id="taskWallBtn" class="btn btn-primary btn-large"> 
             🎯 Открыть задания 
         </button> 
         
         <a href="index.html" class="btn btn-secondary">← На главную</a> 
     </div> 
 
     <script> 
         const TASK_BLOCK_ID = 'task-26297'; 
         let taskAdsgram = null; 
         
         function getUserId() {
             const tg = window.Telegram?.WebApp;
             return tg?.initDataUnsafe?.user?.id || 123456;
         }

         document.addEventListener('DOMContentLoaded', () => { 
             if (typeof AdsGram !== 'undefined') { 
                 taskAdsgram = new AdsGram(TASK_BLOCK_ID); 
             } 
             
             document.getElementById('taskWallBtn')?.addEventListener('click', async () => { 
                 if (!taskAdsgram) {
                     alert('Задания недоступны');
                     return;
                 }

                 try { 
                     await taskAdsgram.showAd(); 
                     
                     // Если выполнение дошло сюда — значит пользователь досмотрел
                     const userId = getUserId();
                     const reward = 25; // Награда за задание больше чем за обычную рекламу
                     
                     const res = await fetch('/api/ad-reward', {
                         method: 'POST',
                         headers: { 'Content-Type': 'application/json' },
                         body: JSON.stringify({ 
                             user_id: userId, 
                             reward: reward, 
                             type: 'task_adsgram' 
                         })
                     });
                     
                     const data = await res.json();
                     if (data.success) {
                         alert(`🎉 Задание выполнено! Начислено ${reward} 🪙`);
                     } else {
                         alert('❌ Ошибка начисления награды');
                     }
                 } catch (err) { 
                     if (err.message === 'No ads available') {
                         alert('В данный момент заданий нет. Попробуйте позже.');
                     } else if (err.message !== 'User skipped ad') {
                         console.error('Adsgram error:', err);
                         alert('Ошибка при загрузке задания');
                     }
                 } 
             }); 
         }); 
     </script> 
 </body> 
 </html>
