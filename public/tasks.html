<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DogePay - Задания</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/adsgram.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Задания</h1>
            <p>Выполняй задания и получай монеты</p>
        </div>
        
        <button id="taskWallBtn" class="btn btn-primary btn-large">
            🎯 Открыть задания
        </button>
        
        <a href="index.html" class="btn btn-secondary">← На главную</a>
    </div>

    <script>
        const TASK_BLOCK_ID = 'task-26297';
        let taskAdsgram = null;
        
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof AdsGram !== 'undefined') {
                taskAdsgram = new AdsGram(TASK_BLOCK_ID);
            }
            
            document.getElementById('taskWallBtn')?.addEventListener('click', async () => {
                if (taskAdsgram) {
                    try {
                        await taskAdsgram.showAd();
                        // После выполнения задания — начисли награду
                        // (AdsGram сам отслеживает выполнение)
                    } catch (err) {
                        alert('Задания недоступны');
                    }
                }
            });
        });
    </script>
</body>
</html>
