<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- 🔥 CSP FOR ADSTERRA 🔥 -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes'  blob: filesystem: about:; script-src * 'unsafe-inline' 'unsafe-eval' 'unsafe-hashes'  blob:; style-src * 'unsafe-inline' 'unsafe-hashes'  blob:; img-src *  blob: https:; font-src *  https:; connect-src * https: wss:; frame-src * https:; child-src * https:; worker-src * blob:;">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DogePay</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <div class="logo-bounce">🐕</div>
            <div class="spinner"></div>
            <p class="loading-text">Загрузка...</p>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container" id="main-content">
        
        <!-- ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА -->
        <button id="langSwitch" class="lang-switch" onclick="toggleLanguage()">🇷🇺 🇬🇧</button>
        
        <!-- ШАПКА -->
        <div class="header">
            <div class="logo-float">🐕</div>
            <h1 class="gradient-title">DogePay</h1>
            <p class="subtitle" data-t="subtitle">Зарабатывай DOGE играя</p>
        </div>

        <!-- 📢 ADSTERRA SOCIAL BAR CONTAINER -->
        <div id="adsterra-social-bar" style="min-height: 90px; margin: 12px 0; text-align: center; background: rgba(243,198,35,0.05); border-radius: 12px; padding: 8px;">
            <!-- Social Bar загрузится сюда -->
        </div>

        <!-- КАРТОЧКА БАЛАНСА -->
        <div class="balance-card">
            <p class="balance-label" data-t="balance_label">Твой баланс</p>
            <div class="balance-main">
                <span class="coin-icon">🪙</span>
                <span id="balance" class="balance-number">0</span>
            </div>
            <p class="balance-doge">
                <span>🐕 ~</span>
                <span id="balance-doge">0.0000</span>
                <span>DOGE</span>
            </p>
        </div>

        <!-- КНОПКИ -->
        <div class="buttons-grid">
            <a href="faucet.html" class="btn btn-primary" onclick="playClick()">
                <span class="btn-icon">🚰</span>
                <span data-t="btn_faucet">Кран</span>
            </a>
            <a href="ads.html" class="btn btn-primary" onclick="playClick()">
                <span class="btn-icon">📢</span>
                <span data-t="btn_ads">Реклама</span>
            </a>
            <a href="withdraw.html" class="btn btn-secondary" onclick="playClick()">
                <span class="btn-icon">💸</span>
                <span data-t="btn_withdraw">Вывод</span>
            </a>
        </div>

        <!-- ИНФО -->
        <div class="info-box">
            <p data-t="footer">🔐 Безопасно • ⚡ Быстро • 🌍 Глобально</p>
        </div>

        <!-- ФУТЕР -->
        <div class="footer">
            <p>🐕 DogePay v1.0</p>
        </div>
    </div>

    <!-- СКРИПТЫ -->
    <script src="translations.js"></script>
    <script src="app.js"></script>
    
    <!-- 📢 ADSTERRA SOCIAL BAR (ID: 28915264) -->
    <script src="https://pl29015763.profitablecpmratenetwork.com/41/23/92/4123926d7a745b419b89677d56e2093a.js"></script>
    
    <!-- ЗАЩИТНЫЕ ЗАГЛУШКИ (не меняют дизайн, предотвращают ошибки) -->
    <script>
        (function() {
            // Заглушка для toggleLanguage, если не определена
            if (typeof window.toggleLanguage === 'undefined') {
                window.toggleLanguage = function() {
                    console.log('toggleLanguage stub');
                    if (window.Telegram?.WebApp?.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                    }
                };
            }
            // Заглушка для playClick
            if (typeof window.playClick === 'undefined') {
                window.playClick = function() {
                    if (window.Telegram?.WebApp?.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                    }
                };
            }
            // Заглушка для initApp (вызывается при загрузке)
            if (typeof window.initApp === 'undefined') {
                window.initApp = function() {
                    console.log('initApp stub');
                };
            }
        })();
    </script>
    
    <!-- ИНИЦИАЛИЗАЦИЯ -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loading = document.getElementById('loading-screen');
                const main = document.getElementById('main-content');
                
                if (loading) loading.classList.add('hidden');
                if (main) {
                    main.style.display = 'block';
                    main.classList.add('fade-in');
                }
                
                if (window.initApp) {
                    try { window.initApp(); } catch(e) { console.error('initApp error:', e); }
                }
            }, 1500);
        });
    </script>
</body>
</html>
