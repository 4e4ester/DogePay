name: Keep Render Alive

on:
  schedule:
    # 🕐 Каждые 7 минут
    - cron: '*/7 * * * *'
  workflow_dispatch:  # Можно запустить вручную

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s "https://dogepay.onrender.com/api/balance?user_id=ping" > /dev/null
          echo "✅ Ping sent at $(date)"
